<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Panel</title>

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .layer-item {
            border: 1px solid #dee2e6;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <h1 class="mb-4">Calculator Panel - Floor Properties</h1>
        
        <div class="row">
            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">Settings</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="methodSelect" class="form-label">Analytical Method</label>
                            <select id="methodSelect" class="form-select">
                                <option value="shear">Shear Analogy (3-9 Layers)</option>
                                <option value="gamma">Gamma Method (3 or 5 Layers)</option>
                            </select>
                        </div>
                        <div class="mb-3 d-none" id="gammaSpanContainer">
                            <label for="spanInput" class="form-label">Span L (mm)</label>
                            <input type="number" id="spanInput" class="form-control" value="4000">
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">CLT Layers</h5>
                        <button id="addLayerBtn" class="btn btn-sm btn-primary">+ Add Layer</button>
                    </div>
                    <div class="card-body" id="layersContainer">
                        <!-- Layers will be injected here via JS -->
                    </div>
                </div>
                
                <div class="mt-4">
                    <button id="calculateBtn" class="btn btn-success btn-lg w-100">Calculate Properties</button>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Result</h5>
                    </div>
                    <div class="card-body">
                        <div id="resultBox" class="alert alert-info d-none">
                            <h6 class="alert-heading">Effective Bending Stiffness (EI_eff)</h6>
                            <p class="mb-0 fs-4 fw-bold"><span id="eiResult">0</span> <small class="fs-6 text-muted">N·mm²/m</small></p>
                        </div>
                        <div id="errorBox" class="alert alert-danger d-none">
                            <span id="errorMsg"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Include Data Types -->
    <script src="type/material-grade-type.js"></script>
    <script src="type/clt-layer-type.js"></script>
    <script src="type/clt-layup-type.js"></script>
    <script src="type/panel-properties-type.js"></script>
    <!-- Include Calculation Engine -->
    <script src="calculation/panel-properties.js"></script>
    <!-- Main JS -->
    <script src="calculator.js"></script>
</body>
</html>
